<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDown Text</title> 
    <style>
        .dropdown {
            position: relative;
        }

        .content {
            font-family: Arial, Helvetica, sans-serif; 
            padding: 5px 15px; 
            border: 1px solid black; 
            display: none; 
            position: absolute;
        } 

        .dropdown:hover .content {
            display: block;
        }
    </style>
</head>
<body>
    <div class="dropdown">Mouse Over Me
         <p class="content">Hello World</p>
    </div> 
    <time>November 26, 2025</time>
</body>
</html>
