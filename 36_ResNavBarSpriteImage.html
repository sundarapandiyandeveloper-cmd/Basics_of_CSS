<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Nav Bar Using Sprite Image</title>
    <style>
        body {
            margin: 0px;
        }
        nav ul {
            padding: 10px 5px; 
            margin: 0px; 
            list-style-type: none; 
            background-color: rgb(245, 245, 245);
            
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: space-between;
            gap: 25px;
        }

        .Icon {
            display: block;
            background-image: url("Images/10_img_navsprites.gif");
            width: 43px; 
            height: 44px; 
        } 

        #Home {
            background-position: 0px 0px;
        } 

        #Forward {
            background-position: -45px 0px;
        } 

        #Backward {
            background-position: -89px 0px;
        } 

        .Icon:hover {
            filter: brightness(1.5);
        }

        @media only screen and (max-width: 400px) {
            nav ul {
                flex-direction: column; 
                align-items: center;
            } 
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" id="Forward" class="Icon"></a></li> 
            <li><a href="#" id="Home" class="Icon"></a></li> 
            <li><a href="#" id="Backward" class="Icon"></a></li>
        </ul>
    </nav>
    <time>November 26, 2025</time>
</body>
</html>
