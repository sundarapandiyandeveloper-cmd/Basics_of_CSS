<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Attribute Selector</title> 
    <style>
        /* Simple Attribute Selector using only attribute name */ 
        [title] {
            color: red;
        } 

        div[title] {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1 title="Main Heading">CSS Attribute Selector</h1> 
    <p>This is a paragraph section</p>
    <div title="Div Block">This is a div section</div>
    <time>November 27, 2025</time>
</body>
</html>
