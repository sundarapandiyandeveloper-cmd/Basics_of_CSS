<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Attribute Selector Using ^</title> 
    <style>
       /* starts with a specific value */ 
       [title^="content"] {
            color: red;
        }
    </style>
</head>
<body>
    <h1 title="content Heading">Main Heading</h1> 
    <p title="Paragraphcontent">This is a paragraph section</p> 
    <div title="contentDivBlock">This is a div section</div> 
    <time>November 27, 2025</time>
</body>
</html>
