<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Attribute Selector Using $</title> 
    <style> 
        /* ends with a specific value */
        [title$="ent"] {
            color: red; 
        }
    </style>
</head>
<body>
    <h1 title="SeoContent">Main Heading</h1> 
    <p title="Content Paragraph">This is a paragraph section</p> 
    <div title="Div Content">This is a div section</div> 
    <time>November 27, 2025</time>
</body>
</html>
