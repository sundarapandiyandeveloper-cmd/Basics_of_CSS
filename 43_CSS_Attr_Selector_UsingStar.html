<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Attribute Selector Using *</title> 
    <style>
        /* contains a specific value */
        [title*="ent"] {
            color: blue; 
        }
    </style>
</head>
<body>
    <h1 title="content heading">Main Heading</h1> 
    <p title="paragraph content">This is a paragraph</p> 
    <div title="section content div">This is div section</div>    
    <time>November 27, 2025</time>
</body>
</html>
