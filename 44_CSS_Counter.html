<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Counter</title> 
    <style>
        body {
            counter-reset: headTwo para; 
        }

        h2::Before {
            counter-increment: headTwo; 
            content: counter(headTwo) " : "; 
        }

        p::after {
            counter-increment: para;
            content: " - " counter(para) " Section"; 
        }
    </style>
</head>
<body>
    <h1>CSS Counter Using Heading & Paragraph</h1> 

    <h2>HTML</h2> 
    <p>HyperText Markup Language</p> 

    <h2>CSS</h2> 
    <p>Cascading Style Sheet</p> 

    <h2>Javascript</h2> 
    <p>Client Side Scripting Language</p> 

    <h2>Bootstrap</h2> 
    <p>CSS Framework</p> 

    <h2>React js</h2> 
    <p>Javascript Framewrork</p> 
    
    <time>November 27, 2025</time>
</body>
</html>
