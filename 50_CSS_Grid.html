<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout Module</title> 
    <style>
        .gridContainer {
            
            /* grid-template-columns: auto auto auto; 
            grid-template-rows: 80px 250px; */ 

            /* justify-content: center; 
            align-content: end; */ 
            
            display: grid; 
            grid-template-columns: repeat(3, 200px); 
            grid-auto-rows: 50px; /* Set a fixed row height - ensures each row in the grid has a fixed height regardless of the container height. */  
            gap: 5px;
            place-content: end center;
            
            height: 300px;
            background-color: dodgerblue; 
            padding: 10px;
        }

        .gridContainer > div {
            font-size: 1.5em;
            padding: 15px 25px; 
            border: 1px solid black; 
            background-color: rgb(235, 235, 235); 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gridContainer">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div> 
    <time>November 29, 2025</time>
</body>
</html>
